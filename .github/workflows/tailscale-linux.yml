name: Tailscale on Linux

on:
  workflow_dispatch:

jobs:
  tailscale:
    runs-on: ubuntu-latest

    steps:
      - name: Disable unused Microsoft and Google repositories
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) -print0 |
            sudo xargs -0 -r grep -lE 'packages\.microsoft\.com|dl\.google\.com' |
            sudo xargs -r -d '\n' -I{} mv "{}" "{}.disabled"

      - name: Remove unused desktop packages
        run: |
          sudo apt purge -y firefox 'gnome*' 'ubuntu-desktop*' 'ubuntu-gnome-desktop*' 'mesa*' || true
          sudo snap remove --purge firefox 2>/dev/null || true
          sudo apt autoremove -y

      - name: Setup SSH and update system
        env:
          SSH_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y openssh-server
          sudo systemctl enable --now ssh

          sudo useradd -m -s /bin/bash runner || true
          echo "runner:$SSH_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Configure forwarding and UDP GRO
        run: |
          echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/99-tailscale.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf

          NETDEV=$(ip -o route get 8.8.8.8 | awk '{print $5; exit}')
          echo "Network device: $NETDEV"
          sudo ethtool -K "$NETDEV" rx-udp-gro-forwarding on rx-gro-list off

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname=gh-linux-test \
            --advertise-exit-node
          sudo tailscale set --accept-dns=false

      - name: Check Tailscale
        run: |
          tailscale status
          tailscale ip -4
          tailscale ip -6
          tailscale netcheck

      - name: Check SSH
        run: |
          systemctl status ssh --no-pager
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo "SSH listening:"
          ss -lntp | grep ':22'

      - name: Keep alive
        run: |
          echo "Tailscale exit node is running. Keeping the runner alive..."
          sleep 21600
