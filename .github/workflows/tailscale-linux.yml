name: Tailscale on Linux

on:
  workflow_dispatch:

jobs:
  tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname=gh-linux-test \
            --advertise-exit-node

      - name: Check Tailscale
        run: |
          tailscale status
          tailscale ip -4
          tailscale ip -6
          tailscale netcheck

      - name: Setup SSH
        env:
          SSH_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          sudo apt update
          sudo apt install -y openssh-server
          sudo systemctl enable --now ssh

          sudo useradd -m -s /bin/bash runner || true
          echo "runner:$SSH_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Check SSH
        run: |
          systemctl status ssh --no-pager
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo "SSH listening:"
          ss -lntp | grep ':22'

      - name: Keep alive
        run: |
          while true; do
            echo "Running..."
            tailscale status
            sleep 60
          done
