name: Tailscale on MacOS

on:
  workflow_dispatch:

jobs:
  tailscale:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale
        run: |
          brew install --quiet tailscale

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscaled install-system-daemon
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname=gh-macos-test

      - name: Check macOS and Tailscale
        run: |
          sw_vers
          tailscale status
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo "Tailscale IPv6:"
          tailscale ip -6
          tailscale netcheck

      - name: Create VNC user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if id -u runneradmin >/dev/null 2>&1; then
            echo "runneradmin already exists"
          else
            sudo sysadminctl -addUser runneradmin -fullName "Runner Admin" -password "$RDP_PASSWORD" -admin
          fi
          sudo dscl . -create /Users/runneradmin UserShell /bin/zsh
          sudo dscl . -create /Users/runneradmin NFSHomeDirectory /Users/runneradmin
          sudo createhomedir -c -u runneradmin >/dev/null 2>&1 || true
          echo "VNC username: runneradmin"

      - name: Enable SSH
        run: |
          sudo systemsetup -setremotelogin on
          sudo launchctl print system/com.openssh.sshd >/dev/null
          echo "SSH listening:"
          sudo lsof -nP -iTCP:22 -sTCP:LISTEN || true

      - name: Configure VNC Remote Management
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          # Restrict ARD access to the dedicated remote user.
          sudo "$ARD" \
            -configure \
            -allowAccessFor \
            -specifiedUsers

          sudo "$ARD" \
            -activate \
            -configure \
            -users runneradmin \
            -access -on \
            -agent \
            -privs -all

          # Set the VNC password using Apple's VNC settings file.
          # The password is generated by the workflow and never written to the repository.
          python3 - "$RDP_PASSWORD" <<'PY'
          import base64
          import plistlib
          import subprocess
          import sys

          password = sys.argv[1].encode()
          if len(password) > 8:
              password = password[:8]

          # Apple legacy VNC authentication stores the first 8 password bytes
          # in an encrypted/obfuscated value. Generate it using openssl DES.
          key = bytes.fromhex("1723456789abcdef")
          padded = password.ljust(8, b"\x00")
          result = subprocess.check_output(
              ["openssl", "enc", "-des-ecb", "-K", key.hex(), "-nopad"],
              input=padded,
              stderr=subprocess.DEVNULL,
          )
          with open("/tmp/com.apple.VNCSettings.txt", "wb") as f:
              f.write(result.hex().encode())
          PY
          sudo cp /tmp/com.apple.VNCSettings.txt /Library/Preferences/com.apple.VNCSettings.txt
          rm -f /tmp/com.apple.VNCSettings.txt
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt
          sudo chown root:wheel /Library/Preferences/com.apple.VNCSettings.txt

          # Enable legacy VNC authentication and restart the ARD console agent.
          sudo "$ARD" \
            -activate \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          sudo "$ARD" -restart -agent -console
          sudo "$ARD" -activate

          echo "VNC listening:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

      - name: Keep alive
        run: |
          while true; do
            echo "Running..."
            tailscale status
            sleep 60
          done
