name: Tailscale + SSH + VNC on macOS

on:
  workflow_dispatch:

jobs:
  tailscale:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale
        run: |
          brew install --quiet tailscale

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscaled install-system-daemon
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname=gh-macos-test

      - name: Check macOS and Tailscale
        run: |
          sw_vers
          tailscale status
          tailscale ip -4
          tailscale ip -6
          tailscale netcheck

      - name: Enable SSH
        run: |
          sudo systemsetup -setremotelogin on
          sudo launchctl print system/com.openssh.sshd >/dev/null
          echo "SSH listening:"
          sudo lsof -nP -iTCP:22 -sTCP:LISTEN || true

      - name: Enable VNC Screen Sharing
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -privs -all \
            -restart -agent -menu

          echo "VNC listening:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

      - name: Show remote access information
        run: |
          echo "=== Tailscale ==="
          tailscale status
          echo
          echo "=== SSH ==="
          echo "ssh runner@$(tailscale ip -4)"
          echo
          echo "=== VNC ==="
          echo "vnc://$(tailscale ip -4):5900"

      - name: Keep alive
        run: |
          while true; do
            echo "Running..."
            tailscale status
            sleep 60
          done
