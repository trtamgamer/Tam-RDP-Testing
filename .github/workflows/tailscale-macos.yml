name: Tailscale on MacOS

on:
  workflow_dispatch:

jobs:
  tailscale:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale
        run: |
          brew install --quiet tailscale

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscaled install-system-daemon
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname=gh-macos-test

      - name: Check macOS and Tailscale
        run: |
          sw_vers
          tailscale status
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo "Tailscale IPv6:"
          tailscale ip -6
          tailscale netcheck

      - name: Create VNC user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if id -u runneradmin >/dev/null 2>&1; then
            echo "runneradmin already exists"
          else
            sudo sysadminctl -addUser runneradmin -fullName "Runner Admin" -password "$RDP_PASSWORD" -admin
          fi
          sudo dscl . -create /Users/runneradmin UserShell /bin/zsh
          sudo dscl . -create /Users/runneradmin NFSHomeDirectory /Users/runneradmin
          sudo createhomedir -c -u runneradmin >/dev/null 2>&1 || true
          echo "VNC username: runneradmin"

      - name: Enable SSH
        run: |
          sudo systemsetup -setremotelogin on
          sudo launchctl print system/com.openssh.sshd >/dev/null
          echo "SSH listening:"
          sudo lsof -nP -iTCP:22 -sTCP:LISTEN || true

      - name: Configure VNC Remote Management
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          # Restrict ARD access to the dedicated remote user.
          sudo "$ARD" \
            -configure \
            -allowAccessFor \
            -specifiedUsers

          sudo "$ARD" \
            -activate \
            -configure \
            -users runneradmin \
            -access -on \
            -agent \
            -privs -all

          # Enable Apple's legacy VNC authentication.
          sudo "$ARD" \
            -activate \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          # Generate Apple's legacy VNC password file without OpenSSL DES.
          # Legacy VNC passwords are limited to the first 8 characters.
          python3 - "$RDP_PASSWORD" <<'PY'
          import pathlib
          import sys

          password = sys.argv[1].encode("utf-8")[:8]
          key = bytes.fromhex("1734516E8BA8C5E2FF1C39567390ADCA")
          padded = password.ljust(8, b"\x00")
          encrypted = bytes(
              key[i] ^ (padded[i] if i < 8 else 0)
              for i in range(len(key))
          )

          pathlib.Path("/tmp/com.apple.VNCSettings.txt").write_text(
              encrypted.hex().upper() + "\n",
              encoding="ascii",
          )
          PY
          sudo install -o root -g wheel -m 600 \
            /tmp/com.apple.VNCSettings.txt \
            /Library/Preferences/com.apple.VNCSettings.txt
          rm -f /tmp/com.apple.VNCSettings.txt

          # Restart the ARD console agent and activate Remote Management.
          sudo "$ARD" -restart -agent -console
          sudo "$ARD" -activate

          echo "VNC listening:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

      - name: Keep alive
        run: |
          while true; do
            echo "Running..."
            tailscale status
            sleep 60
          done
