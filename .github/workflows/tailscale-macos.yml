name: Tailscale on MacOS

on:
  workflow_dispatch:

jobs:
  tailscale:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale
        run: |
          brew install --quiet tailscale

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscaled install-system-daemon
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname=gh-macos-test

      - name: Check macOS and Tailscale
        run: |
          sw_vers
          tailscale status
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo "Tailscale IPv6:"
          tailscale ip -6
          tailscale netcheck

      - name: Create VNC user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if id -u runneradmin >/dev/null 2>&1; then
            echo "runneradmin already exists"
          else
            sudo sysadminctl -addUser runneradmin -fullName "Runner Admin" -password "$RDP_PASSWORD" -admin
          fi
          sudo dscl . -create /Users/runneradmin UserShell /bin/zsh
          sudo dscl . -create /Users/runneradmin NFSHomeDirectory /Users/runneradmin
          sudo createhomedir -c -u runneradmin >/dev/null 2>&1 || true
          echo "VNC username: runneradmin"

      - name: Enable SSH
        run: |
          sudo systemsetup -setremotelogin on
          sudo launchctl print system/com.openssh.sshd >/dev/null
          echo "SSH listening:"
          sudo lsof -nP -iTCP:22 -sTCP:LISTEN || true

      - name: Configure VNC Remote Management
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          sudo "$ARD" \
            -configure \
            -allowAccessFor \
            -specifiedUsers

          sudo "$ARD" \
            -activate \
            -configure \
            -users runneradmin \
            -access -on \
            -agent \
            -privs -all

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          # Apple legacy VNC stores a 16-byte XOR-obfuscated password.
          # Only the first 8 password bytes are used by legacy VNC.
          printf '%s\n' "$RDP_PASSWORD" | perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" }
            $_ = <>
            chomp
            s/^(.{8}).*/$1/
            @p = unpack "C*", $_
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }
            print "\n"
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt >/dev/null

          sudo chown root:wheel /Library/Preferences/com.apple.VNCSettings.txt
          sudo chmod 600 /Library/Preferences/com.apple.VNCSettings.txt

          sudo "$ARD" -restart -agent -console
          sudo "$ARD" -activate

          echo "VNC listening:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

      - name: Keep alive
        run: |
          while true; do
            echo "Running..."
            tailscale status
            sleep 60
          done
