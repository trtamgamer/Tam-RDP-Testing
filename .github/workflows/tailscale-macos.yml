name: Tailscale on MacOS

on:
  workflow_dispatch:

jobs:
  tailscale:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale
        run: |
          brew install --quiet tailscale

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscaled install-system-daemon
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname=gh-macos-test

      - name: Check macOS and Tailscale
        run: |
          sw_vers
          tailscale status
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo "Tailscale IPv6:"
          tailscale ip -6
          tailscale netcheck

      - name: Create VNC user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if id -u runneradmin >/dev/null 2>&1; then
            echo "runneradmin already exists"
          else
            sudo sysadminctl -addUser runneradmin -fullName "Runner Admin" -password "$RDP_PASSWORD" -admin
          fi
          sudo dscl . -create /Users/runneradmin UserShell /bin/zsh
          sudo dscl . -create /Users/runneradmin NFSHomeDirectory /Users/runneradmin
          sudo createhomedir -c -u runneradmin >/dev/null 2>&1 || true
          echo "VNC username: runneradmin"

      - name: Enable SSH
        run: |
          sudo systemsetup -setremotelogin on
          sudo launchctl print system/com.openssh.sshd >/dev/null
          echo "SSH listening:"
          sudo lsof -nP -iTCP:22 -sTCP:LISTEN || true

      # --- KEY FIX #1: force autologin so there's an actual console/desktop
      # session for VNC to attach to. Without this, ARD/VNC connects fine
      # but shows a black screen because nobody is "logged in" at console.
      - name: Enable auto-login for runneradmin
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser -string "runneradmin"
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0
          echo "autoLoginUser set to runneradmin"

      - name: Inspect runner virtual display
        run: |
          echo "=== SPDisplaysDataType ==="
          system_profiler SPDisplaysDataType || true
          echo "=== ioreg display devices ==="
          ioreg -l -w 0 | grep -Ei 'IODisplay|DisplayVendorID|DisplayProductID|IOFramebuffer' | head -100 || true
          echo "=== WindowServer display preferences ==="
          sudo defaults read /Library/Preferences/com.apple.windowserver 2>/dev/null || true

      - name: Configure virtual display preferences
        run: |
          # GitHub's macOS VM already provides a virtual display. Do not create
          # another display; make sure WindowServer has a usable headless mode
          # and a deterministic 1280x720 starting resolution.
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement \
            VNCAlwaysMultiUser -bool false
          sudo defaults write /Library/Preferences/com.apple.windowserver \
            DisplayResolutionEnabled -bool true
          sudo defaults write /Library/Preferences/com.apple.windowserver \
            StartingRes -dict Width 1280 Height 720
          sudo defaults read /Library/Preferences/com.apple.windowserver || true

      # NOTE: do NOT bootout/bootstrap com.apple.loginwindow here.
      # On a GitHub-hosted macOS VM, that daemon underpins the GUI session
      # the Actions runner itself depends on — killing it cancels the job
      # (that's the "operation was canceled" error). autoLoginUser above
      # takes effect on the VM's next real boot cycle; we can't safely
      # force it mid-session without a full VM reboot, which would also
      # kill the runner process. So we just check current session state
      # and let kickstart -restart -console (below) re-bind the display.
      - name: Check current console session
        run: |
          echo "=== who is logged in ==="
          who || true
          stat -f "%Su" /dev/console || true

      - name: Configure VNC Remote Management
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          sudo "$ARD" \
            -configure \
            -allowAccessFor \
            -specifiedUsers

          sudo "$ARD" \
            -activate \
            -configure \
            -users runner \
            -access -on \
            -agent \
            -privs -all

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "$RDP_PASSWORD"

          sudo "$ARD" -restart -agent -console
          sudo "$ARD" -activate

          echo "=== Final display state ==="
          system_profiler SPDisplaysDataType || true
          echo "=== console session ==="
          who || true
          echo "=== VNC listening ==="
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

      - name: Keep alive
        run: |
          while true; do
            echo "Running..."
            tailscale status
            sleep 60
          done
