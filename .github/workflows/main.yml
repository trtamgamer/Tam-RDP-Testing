name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Set Password for runneradmin
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          if (-not $password) {
              Write-Error "RDP_PASSWORD secret is not set!"
              exit 1
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $securePass
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
          Write-Host "Password set successfully for runneradmin"
          echo "RDP_CREDS=User: runneradmin | Password: $password" >> $env:GITHUB_ENV

      - name: Clean Desktop Icons
        run: |
          Remove-Item "$env:USERPROFILE\Desktop\*" -Force -Recurse -ErrorAction SilentlyContinue
          Remove-Item "C:\Users\Public\Desktop\*" -Force -Recurse -ErrorAction SilentlyContinue

      - name: Remove Unused Tools from C:\
        run: |
          $toRemove = @(
            "C:\Android",
            "C:\Julia",
            "C:\Miniconda",
            "C:\mingw32",
            "C:\mingw64",
            "C:\msys64",
            "C:\ghcup",
            "C:\npm",
            "C:\azureCli",
            "C:\azureDevOpsCli",
            "C:\cobertura-2.1.1",
            "C:\post-generation",
            "C:\PostgreSQL",
            "C:\Modules",
            "C:\vcpkg",
            "C:\tools",
            "C:\Strawberry",
            "C:\shells",
            "C:\SeleniumWebDrivers",
            "C:\selenium",
            "C:\rtools45",
            "C:\image",
            "C:\Packages",
            "C:\WindowsAzure",
            "C:\actionarchivecache",
            "C:\hostedtoolcache",
            "C:\imagedata.json",
            "C:\software-report.json",
            "C:\software-report.md",
            "C:\PSModuleAnalysisCachePath"
          )
          foreach ($path in $toRemove) {
            if (Test-Path $path) {
              Write-Host "Removing $path ..."
              Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Done: $path"
            } else {
              Write-Host "Not found, skipping: $path"
            }
          }
          Write-Host "Folder cleanup complete!"

      - name: Uninstall Unused Programs
        run: |
          # 7-Zip duoc giu lai, Visual C++, Tailscale, Windows core khong xoa
          $appsToRemove = @(
            "AWS Command Line Interface v2",
            "AWS SAM Command Line Interface",
            "Azure Cosmos DB Emulator",
            "CMake",
            "Git",
            "GitHub CLI",
            "IIS 10.0 Express",
            "ImageMagick 7.1.2-15 Q16-HDRI (64-bit)",
            "Inno Setup version 6.7.1",
            "LLVM",
            "Microsoft .NET SDK 9.0.311 (x64) from Visual Studio",
            "Microsoft Azure Authoring Tools - v2.9.7",
            "Microsoft Azure CLI (64-bit)",
            "Microsoft Azure Compute Emulator - v2.9.7",
            "Microsoft Azure Libraries for .NET - v2.9",
            "Microsoft Azure Service Fabric",
            "Microsoft Azure Service Fabric SDK",
            "Microsoft ODBC Driver 17 for SQL Server",
            "Microsoft OLE DB Driver 19 for SQL Server",
            "Microsoft SQL Server 2016 Management Objects  (x64)",
            "Microsoft SQL Server 2019 LocalDB",
            "Microsoft SQL Server Data-Tier Application Framework",
            "Microsoft SQL Server Integration Services Projects",
            "Microsoft Visual Studio 2010 Tools for Office Runtime (x64)",
            "Microsoft System CLR Types for SQL Server 2016",
            "Microsoft System CLR Types for SQL Server 2019",
            "Microsoft Visual Studio Tools for Applications 2022",
            "Miniconda3 py313_25.11.1-1 (Python 3.13.11 64-bit)",
            "MongoDB 7.0.30 2008R2Plus SSL (64 bit)",
            "MongoDB Shell",
            "Mozilla Firefox (x64 en-US)",
            "Mozilla Maintenance Service",
            "MySQL Server 8.0",
            "Node.js",
            "OpenSSL 3.6.1 (64-bit)",
            "PostgreSQL 17",
            "PowerShell Extensions for SQL Server 2016",
            "Python Launcher",
            "R for Windows 4.5.2",
            "Rtools 4.5 (6768-6492)",
            "sbt 1.12.5",
            "Session Manager Plugin",
            "Strawberry Perl (64-bit)",
            "Unity Hub 3.14.4",
            "Visual Studio Enterprise 2022",
            "WiX Toolset v3.14.1.8722",
            "Microsoft Web Deploy 4.0",
            "Microsoft Web Platform Installer 5.1",
            "Windows SDK AddOn",
            "vs_CoreEditorFonts",
            "Windows Software Development Kit - Windows 10.0.26100.7705"
          )

          foreach ($app in $appsToRemove) {
                      Write-Host "----------------------------"
                      Write-Host "Processing: $app"
                      
                      $p = Start-Process winget -ArgumentList "uninstall --name `"$app`" --silent --accept-source-agreements --force" -PassThru -NoNewWindow -ErrorAction SilentlyContinue
                      
                      if (-not $p.WaitForExit(90000)) {
                        Stop-Process -Id $p.Id -Force
                        Write-Host "Skip: $app (The app is unresponsive, the system will automatically skip the uninstallation process.)" -ForegroundColor Yellow
                      } else {
                        if ($p.ExitCode -eq 0) { Write-Host "Done: $app" }
                        else { Write-Host "Failed: $app (Error Code: $($p.ExitCode))" }
                      }
          }
          Write-Host "Program uninstall complete!"

      - name: Install WinRAR
        run: |
          Write-Host "Installing WinRAR..."
          $winrarUrl = "https://www.win-rar.com/fileadmin/winrar-versions/winrar-x64-713vn.exe"
          $installerPath = "$env:TEMP\winrar-setup.exe"
          Invoke-WebRequest -Uri $winrarUrl -OutFile $installerPath
          Start-Process $installerPath -ArgumentList "/S" -Wait
          Remove-Item $installerPath -Force
          Write-Host "WinRAR installed!"

      - name: Install Tailscale
        run: |
          Write-Host "Installing Tailscale..."
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.96.3-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Tailscale installed!"

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Hide Agent Window
        run: |
          $src = "using System; using System.Runtime.InteropServices; public class Win32 { [DllImport(`"user32.dll`")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow); [DllImport(`"user32.dll`")] public static extern IntPtr FindWindow(string lpClassName, string lpWindowName); }"
          Add-Type -TypeDefinition $src -Language CSharp
          $hwnd = [Win32]::FindWindow($null, "C:\ProgramData\GitHub\HostedComputeAgent\hosted-compute-agent")
          if ($hwnd -ne [IntPtr]::Zero) { [Win32]::ShowWindow($hwnd, 0) }
          Get-Process | Where-Object { $_.MainWindowTitle -like "*hosted-compute-agent*" } | ForEach-Object {
              [Win32]::ShowWindow($_.MainWindowHandle, 0)
          }

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: runneradmin"
          Write-Host "Password: ${{ secrets.RDP_PASSWORD }}"
          Write-Host "==================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
